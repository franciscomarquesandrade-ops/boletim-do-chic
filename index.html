<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site funcione bem em celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <!-- Liga o arquivo de estilo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <!-- ÁREA DE ACESSO / PIN -->
  <section id="area-login" class="card-acesso">
    <h2>Acesso ao Boletim</h2>
    <div class="info-aluno-fixa">
      <span><strong>Turma:</strong> 9A</span>
      <span><strong>Chamada:</strong> 12</span>
    </div>
    <div class="form-login">
      <input type="password" id="input-pin" placeholder="Digite seu PIN" maxlength="20" />
      <button type="button" id="btn-entrar">Entrar</button>
    </div>
    <p id="msg-login" class="mensagem-status"></p>
  </section>

  <!-- CONTEÚDO PRINCIPAL (OCULTO ANTES DO LOGIN) -->
  <main id="conteudo-boletim" style="display: none;">
    
    <!-- BARRA DE AÇÕES -->
    <div class="barra-acoes">
      <button type="button" id="btn-alterar">Alterar dados</button>
      <button type="button" id="btn-salvar" style="display: none;">Salvar alterações</button>
      <button type="button" id="btn-cancelar" style="display: none;">Cancelar</button>
    </div>
    <p id="msg-boletim" class="mensagem-status"></p>

    <!-- CARDS DE RESUMO -->
    <section class="cards">
      <div class="card">
        <h2>Média Geral</h2>
        <p id="media-geral">—</p>
      </div>

      <div class="card">
        <h2>Total de Faltas</h2>
        <p id="total-faltas">—</p>
      </div>

      <div class="card">
        <h2>Bom Desempenho</h2>
        <p id="total-bom">—</p>
      </div>

      <div class="card">
        <h2>Precisam de Atenção</h2>
        <p id="total-atencao">—</p>
      </div>

      <div class="card">
        <h2>Frequência</h2>
        <p id="frequencia">—</p>
        <small id="frequencia-texto"></small>
      </div>
    </section>

    <!-- TABELA DE DISCIPLINAS -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas (Tri 1, 2, 3)</th>
            <th>Situação</th>
          </tr>
        </thead>
        <!-- O JavaScript vai preencher o corpo da tabela -->
        <tbody id="corpo-tabela"></tbody>
      </table>
    </section>

  </main>

  <!-- Liga o arquivo de JavaScript -->
  <script src="script.js"></script>
</body>
</html>
